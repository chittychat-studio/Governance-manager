# Tier 2 = tier 1 + P9 (SPEC P3, P9).
id: tier2/fastapi-postgres/claude-code
version: 2
tier: 2
stack: fastapi-postgres
agent: claude-code
extends: tier1/fastapi-postgres/claude-code
rules:
  - id: P9-guardrail-self-edit
    spec: P9
    text: The agent cannot edit its own guardrails (.claude/settings*.json, .claude/hooks/, governance.yaml, Governor state).
    enforcement: enforced
    mechanism: [deny_rule, hook]
    agents: [claude-code, codex]
    deny: ['Edit(./.claude/settings.json)', 'Edit(./.claude/settings.local.json)', 'Edit(./.claude/hooks/**)',
           'Edit(./governance.yaml)', 'Edit(./.claude/.governor-managed.json)', 'Edit(./.claude/governor/state/**)']
    hook:
      path_deny_write: ['.claude/settings.json', '.claude/settings.local.json', '.claude/hooks/*', 'governance.yaml',
                        '.claude/.governor-managed.json', '.claude/governor/state/*', '.claude/governor/governor.log']
      bash_deny:
        # Any command naming a guardrail path, unless the command only reads.
        - '^(?!(cat|less|more|head|tail|grep|egrep|fgrep|rg|ls|dir|wc|diff|stat|file|type|cd|pushd|get-content|gc|select-string|git(\s+-\S+)*\s+(diff|status|log|show|blame|add|commit|ls-files))\b).*(\.claude[/\\](settings(\.local)?\.json|hooks\b|governor[/\\](state|governor\.log)|\.governor-managed\.json)|governance\.yaml|(^|\s)\.claude[/\\]?(\s|$))'
        # Redirects into a guardrail path, whatever the command.
        - '>{1,2}\s*["'']?\S*(\.claude[/\\](settings|hooks|governor[/\\](state|governor\.log)|\.governor-managed)|governance\.yaml)'
  - id: P9-db-dump
    spec: P9
    text: Database dump commands need human approval.
    enforcement: enforced
    mechanism: [deny_rule, hook]
    agents: [claude-code, codex]
    ask: ['Bash(pg_dump *)', 'Bash(pg_dumpall *)', 'Bash(mysqldump *)', 'Bash(mongodump *)']
    hook:
      bash_ask:
        - '^(pg_dump|pg_dumpall|mysqldump|mongodump|mongoexport)\b'
        - '^psql\b.*(\\copy|\bcopy\b.*\bto\b)'
        - '^(mysql|psql)\b.*\binto\s+outfile\b'
  - id: P9-destructive-migration
    spec: P9
    text: Destructive schema changes need human approval.
    enforcement: enforced
    mechanism: [deny_rule, hook]
    agents: [claude-code, codex]
    ask: ['Bash(alembic downgrade *)', 'Bash(dropdb *)']
    hook:
      bash_ask:
        - '^(python[\d.]*\s+-m\s+)?alembic\b.*\sdowngrade\b'
        - '^dropdb\b'
        - '\bdrop\s+(table|database|schema)\b'
        - '\btruncate\s+(table\s+)?["\w]'
        - '\bmigrate\s+reset\b'
        - '^(psql|mysql)\b.*\s(-f|--file)\b'
        - '^(python[\d.]*\s+)?manage\.py\s+(flush|reset_db)\b'
  - id: P9-no-pii-in-logs
    spec: P9
    text: Never log request bodies or personal-data fields, and never put real personal data in fixtures.
    enforcement: advisory
    mechanism: [instruction]
    agents: [claude-code, codex]
