# Generated by Governor. Do not edit: re-run scripts/ci.py install (R4).
# Lint + drift on every pull request (SPEC D3). No model calls, no secrets (D4).
name: governor
on:
  pull_request:
permissions:
  contents: read
jobs:
  governor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Lint (V1-V7)
        run: python .governor/scripts/lint.py .
      - name: Drift (D1, D2, D2a)
        run: python .governor/scripts/drift.py .
