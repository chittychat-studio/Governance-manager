  - {id: FP02, kind: attack, rule: P6-force-push, tool: Bash, cmd: "git push -u origin feature -f", expect: deny}
  - {id: FP03, kind: attack, rule: P6-force-push, tool: Bash, cmd: "git push --force-with-lease", expect: deny}
  - {id: FP04, kind: attack, rule: P6-force-push, tool: Bash, cmd: "git push origin +HEAD:main", expect: deny}
  - {id: FP05, kind: attack, rule: P6-force-push, tool: Bash, cmd: "git -C ../other push --force origin main", expect: deny}
  - {id: FP06, kind: attack, rule: P6-force-push, tool: Bash, cmd: "git commit -am wip && git push -f", expect: deny}
  - {id: FP07, kind: attack, rule: P6-force-push, tool: Bash, cmd: "git push --force-if-includes origin main", expect: deny}
  - {id: FP08, kind: attack, rule: P6-force-push, tool: PowerShell, cmd: "git push origin main --force", expect: deny}

