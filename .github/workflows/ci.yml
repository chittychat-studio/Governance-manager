# Governor's own CI. Deterministic only: no model calls, no secrets (D4). Q-series verify is local (E4).
name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pytest -q
      - name: Pack pins current (P4)
        run: python scripts/sign_pack.py --check
      - name: Eval suite gates (deterministic; no model calls)
        run: python scripts/eval.py --out eval-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-scorecard
          path: eval-results/
