# C1 compatibility job: latest Claude Code CLI + Q-series on the reference fixture.
# SPENDS API CREDITS. Manual dispatch only until docs/c1-budget.yaml holds an approved cap (E4).
# Monthly spend is bounded: each run is capped at monthly/31 and the job refuses after 31 runs in a
# calendar month (counted from this workflow's run history).
# To make it nightly, add under `on:`  schedule: [{cron: "17 3 * * *"}]  after approving the cap.
name: compat
on:
  workflow_dispatch:
concurrency:
  group: compat
  cancel-in-progress: false
permissions:
  contents: read
  actions: read
  issues: write
jobs:
  compat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Runs this month (E4 ledger)
        id: ledger
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          since=$(date -u +%Y-%m-01)
          n=$(gh api "repos/${{ github.repository }}/actions/workflows/compat.yml/runs?created=%3E%3D${since}&per_page=100" \
                --jq '.total_count')
          echo "n=$n" >> "$GITHUB_OUTPUT"
      - name: Budget gate (E4)
        id: cap
        shell: bash
        run: |
          # Assignment on its own line so a refusal fails this step (bash -e) instead of passing an empty cap.
          usd=$(python scripts/c1_budget.py --runs-this-month '${{ steps.ledger.outputs.n }}')
          echo "usd=$usd" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -r fixtures/scratch-app/requirements.txt && npm install -g @anthropic-ai/claude-code
      - name: Q-series (Q1-Q3)
        id: verify
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/verify.py --approve --runs 1 --billing api --cap-usd "${{ steps.cap.outputs.usd }}"
      - name: Open an issue when the Q-series fails (C2)
        if: failure() && steps.verify.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --title "C1 compat failed: Claude Code $(claude --version 2>/dev/null || echo unknown)" \
            --body "Q-series failed on the latest Claude Code CLI. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}. Last passing version: see verify-results/last.json on main."
